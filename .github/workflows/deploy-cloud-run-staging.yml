name: Deploy Cloud Run Staging

on:
  push:
    branches:
      - staging/admin-split
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

env:
  PROJECT_ID: content-agent-2-499616
  PROJECT_NUMBER: "340047797097"
  REGION: asia-southeast1
  FRONTEND_SERVICE: contentagent-social-staging
  ADMIN_SERVICE: contentagent-admin-staging
  API_SERVICE: contentagent-api-staging
  AR_REPO: cloud-run-source-deploy
  DATA_BUCKET: contentagent-social-staging-history-content-agent-2-499616
  DATA_OBJECT: app.json
  SQL_CONNECTION: content-agent-2-499616:asia-southeast1:contentagent-postgres-staging
  WORKLOAD_IDENTITY_PROVIDER: projects/340047797097/locations/global/workloadIdentityPools/github-contentagent/providers/github-cabuild
  SERVICE_ACCOUNT: github-cloud-run-deployer@content-agent-2-499616.iam.gserviceaccount.com
  AVATARFLOW_URL: https://avatar-video-generator-staging-mkhae4sjlq-as.a.run.app

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ env.WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ env.SERVICE_ACCOUNT }}

      - name: Set up gcloud
        uses: google-github-actions/setup-gcloud@v2

      - name: Configure Docker
        run: gcloud auth configure-docker $REGION-docker.pkg.dev --quiet

      - name: Prepare persistent staging data store
        continue-on-error: true
        run: |
          gcloud storage buckets describe gs://$DATA_BUCKET >/dev/null 2>&1 || \
            gcloud storage buckets create gs://$DATA_BUCKET --project=$PROJECT_ID --location=$REGION --uniform-bucket-level-access
          RUNTIME_SA=$(gcloud run services describe $API_SERVICE --project=$PROJECT_ID --region=$REGION --format='value(spec.template.spec.serviceAccountName)' 2>/dev/null || true)
          if [ -z "$RUNTIME_SA" ]; then
            RUNTIME_SA="$PROJECT_NUMBER-compute@developer.gserviceaccount.com"
          fi
          gcloud storage buckets add-iam-policy-binding gs://$DATA_BUCKET \
            --member="serviceAccount:$RUNTIME_SA" \
            --role="roles/storage.objectAdmin" >/dev/null 2>&1 || true
          gcloud storage objects describe gs://$DATA_BUCKET/$DATA_OBJECT >/dev/null 2>&1 || \
            gcloud storage cp data-seed/app.json gs://$DATA_BUCKET/$DATA_OBJECT

      - name: Build image
        run: docker build --build-arg NEXT_PUBLIC_AVATARFLOW_URL=$AVATARFLOW_URL -t $REGION-docker.pkg.dev/$PROJECT_ID/$AR_REPO/contentagent-staging:$GITHUB_SHA .

      - name: Push image
        run: docker push $REGION-docker.pkg.dev/$PROJECT_ID/$AR_REPO/contentagent-staging:$GITHUB_SHA

      - name: Write shared Cloud Run env file
        env:
          BREVO_API_KEY: ${{ secrets.BREVO_API_KEY }}
        run: |
          if [ -z "$BREVO_API_KEY" ]; then
            echo "BREVO_API_KEY GitHub secret is missing." >&2
            exit 1
          fi
          cat > cloudrun-env.yaml <<'EOF'
          APIFY_ACTOR_ID: "apify/google-search-scraper"
          APIFY_KEYWORD_ACTOR_ID: "apify/google-search-scraper"
          APIFY_TIKTOK_ACTOR_ID: "clockworks/tiktok-scraper"
          APIFY_INSTAGRAM_ACTOR_ID: "apify/instagram-scraper"
          APIFY_YOUTUBE_ACTOR_ID: "streamers/youtube-scraper"
          APIFY_FACEBOOK_ACTOR_ID: "scrapeforge/facebook-search-posts"
          UPLOAD_POST_PROFILE: "Mariana"
          UPLOAD_POST_DEFAULT_PLATFORMS: "tiktok,facebook,x"
          TELEGRAM_ALLOWED_USER_IDS: "1151114885"
          DATA_STORE_GCS_BUCKET: "${{ env.DATA_BUCKET }}"
          DATA_STORE_GCS_OBJECT: "${{ env.DATA_OBJECT }}"
          DATA_STORE_PROVIDER: "postgres"
          POSTGRES_STATE_ID: "staging"
          POSTGRES_SSL: "false"
          STRIPE_LIVE_SETUP_ENABLED: "true"
          STRIPE_WEBHOOK_BASE_URL: "https://contentagent-api-staging-mkhae4sjlq-as.a.run.app"
          BREVO_FROM_EMAIL: "sean@gigwave.tech"
          BREVO_FROM_NAME: "Gig Wave"
          EOF
          printf 'BREVO_API_KEY: "%s"\n' "$BREVO_API_KEY" >> cloudrun-env.yaml
          cp cloudrun-env.yaml api-env.yaml
          printf 'APP_SURFACE: "api"\n' >> api-env.yaml

      - name: Deploy API service
        run: >
          gcloud run deploy $API_SERVICE
          --project=$PROJECT_ID
          --region=$REGION
          --platform=managed
          --image=$REGION-docker.pkg.dev/$PROJECT_ID/$AR_REPO/contentagent-staging:$GITHUB_SHA
          --env-vars-file=api-env.yaml
          --set-secrets=APP_SECRET=APP_SECRET:latest,KIE_API_TOKEN=KIE_API_TOKEN:latest,APIFY_API_TOKEN=APIFY_API_TOKEN:latest,APIFY_BACKUP_API_TOKEN=APIFY_BACKUP_API_TOKEN:latest,UPLOAD_POST_API_KEY=UPLOAD_POST_API_KEY:latest,DATABASE_URL=DATABASE_URL_STAGING:latest,AUTOMATION_CRON_SECRET=AUTOMATION_CRON_SECRET:latest
          --add-cloudsql-instances=$SQL_CONNECTION
          --quiet

      - name: Keep API service public
        run: >
          gcloud run services update $API_SERVICE
          --project=$PROJECT_ID
          --region=$REGION
          --no-invoker-iam-check
          --quiet

      - name: Deploy Admin service
        run: |
          API_URL=$(gcloud run services describe $API_SERVICE --project=$PROJECT_ID --region=$REGION --format='value(status.url)')
          cp cloudrun-env.yaml admin-env.yaml
          printf 'APP_SURFACE: "admin"\n' >> admin-env.yaml
          printf 'API_SERVICE_URL: "%s"\n' "$API_URL" >> admin-env.yaml
          gcloud run deploy $ADMIN_SERVICE \
            --project=$PROJECT_ID \
            --region=$REGION \
            --platform=managed \
            --image=$REGION-docker.pkg.dev/$PROJECT_ID/$AR_REPO/contentagent-staging:$GITHUB_SHA \
            --env-vars-file=admin-env.yaml \
            --set-secrets=APP_SECRET=APP_SECRET:latest,DATABASE_URL=DATABASE_URL_STAGING:latest \
            --add-cloudsql-instances=$SQL_CONNECTION \
            --quiet

      - name: Keep Admin service public
        run: >
          gcloud run services update $ADMIN_SERVICE
          --project=$PROJECT_ID
          --region=$REGION
          --no-invoker-iam-check
          --quiet

      - name: Deploy Frontend service
        run: |
          API_URL=$(gcloud run services describe $API_SERVICE --project=$PROJECT_ID --region=$REGION --format='value(status.url)')
          ADMIN_URL=$(gcloud run services describe $ADMIN_SERVICE --project=$PROJECT_ID --region=$REGION --format='value(status.url)')
          cp cloudrun-env.yaml frontend-env.yaml
          printf 'APP_SURFACE: "frontend"\n' >> frontend-env.yaml
          printf 'API_SERVICE_URL: "%s"\n' "$API_URL" >> frontend-env.yaml
          printf 'NEXT_PUBLIC_ADMIN_URL: "%s"\n' "$ADMIN_URL" >> frontend-env.yaml
          printf 'NEXT_PUBLIC_AVATARFLOW_URL: "%s"\n' "$AVATARFLOW_URL" >> frontend-env.yaml
          gcloud run deploy $FRONTEND_SERVICE \
            --project=$PROJECT_ID \
            --region=$REGION \
            --platform=managed \
            --image=$REGION-docker.pkg.dev/$PROJECT_ID/$AR_REPO/contentagent-staging:$GITHUB_SHA \
            --env-vars-file=frontend-env.yaml \
            --set-secrets=APP_SECRET=APP_SECRET:latest \
            --quiet

      - name: Keep Frontend service public
        run: >
          gcloud run services update $FRONTEND_SERVICE
          --project=$PROJECT_ID
          --region=$REGION
          --no-invoker-iam-check
          --quiet

      - name: Connect Admin root to Frontend
        run: |
          FRONTEND_URL=$(gcloud run services describe $FRONTEND_SERVICE --project=$PROJECT_ID --region=$REGION --format='value(status.url)')
          gcloud run services update $ADMIN_SERVICE \
            --project=$PROJECT_ID \
            --region=$REGION \
            --update-env-vars="FRONTEND_URL=$FRONTEND_URL" \
            --quiet

      - name: Restrict API CORS to staging surfaces
        run: |
          FRONTEND_URL=$(gcloud run services describe $FRONTEND_SERVICE --project=$PROJECT_ID --region=$REGION --format='value(status.url)')
          ADMIN_URL=$(gcloud run services describe $ADMIN_SERVICE --project=$PROJECT_ID --region=$REGION --format='value(status.url)')
          gcloud run services update $API_SERVICE \
            --project=$PROJECT_ID \
            --region=$REGION \
            --update-env-vars="^|^CORS_ALLOWED_ORIGINS=$FRONTEND_URL,$ADMIN_URL" \
            --quiet
