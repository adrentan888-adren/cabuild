name: Deploy Cloud Run

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

env:
  PROJECT_ID: content-agent-2-499616
  PROJECT_NUMBER: "340047797097"
  REGION: asia-southeast1
  SERVICE: contentagent-social
  AR_REPO: cloud-run-source-deploy
  WORKLOAD_IDENTITY_PROVIDER: projects/340047797097/locations/global/workloadIdentityPools/github-contentagent/providers/github-cabuild
  SERVICE_ACCOUNT: github-cloud-run-deployer@content-agent-2-499616.iam.gserviceaccount.com

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ env.WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ env.SERVICE_ACCOUNT }}

      - name: Set up gcloud
        uses: google-github-actions/setup-gcloud@v2

      - name: Configure Docker
        run: gcloud auth configure-docker $REGION-docker.pkg.dev --quiet

      - name: Build image
        run: docker build -t $REGION-docker.pkg.dev/$PROJECT_ID/$AR_REPO/$SERVICE:$GITHUB_SHA .

      - name: Push image
        run: docker push $REGION-docker.pkg.dev/$PROJECT_ID/$AR_REPO/$SERVICE:$GITHUB_SHA

      - name: Write Cloud Run env file
        run: |
          cat > cloudrun-env.yaml <<'EOF'
          APIFY_ACTOR_ID: "apify/google-search-scraper"
          APIFY_KEYWORD_ACTOR_ID: "apify/google-search-scraper"
          APIFY_TIKTOK_ACTOR_ID: "clockworks/tiktok-scraper"
          APIFY_INSTAGRAM_ACTOR_ID: "apify/instagram-scraper"
          APIFY_YOUTUBE_ACTOR_ID: "streamers/youtube-scraper"
          APIFY_FACEBOOK_ACTOR_ID: "scrapeforge/facebook-search-posts"
          UPLOAD_POST_PROFILE: "Mariana"
          UPLOAD_POST_DEFAULT_PLATFORMS: "tiktok,facebook,x"
          EOF

      - name: Deploy Cloud Run
        run: >
          gcloud run deploy $SERVICE
          --project=$PROJECT_ID
          --region=$REGION
          --platform=managed
          --image=$REGION-docker.pkg.dev/$PROJECT_ID/$AR_REPO/$SERVICE:$GITHUB_SHA
          --env-vars-file=cloudrun-env.yaml
          --set-secrets=APP_SECRET=APP_SECRET:latest,KIE_API_TOKEN=KIE_API_TOKEN:latest,APIFY_API_TOKEN=APIFY_API_TOKEN:latest,UPLOAD_POST_API_KEY=UPLOAD_POST_API_KEY:latest
          --quiet

      - name: Keep service public
        run: >
          gcloud run services update $SERVICE
          --project=$PROJECT_ID
          --region=$REGION
          --no-invoker-iam-check
          --quiet
