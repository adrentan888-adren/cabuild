substitutions:
  _REGION: asia-southeast1
  _SERVICE: contentagent-social
  _AR_REPO: cloud-run-source-deploy
  _DATA_BUCKET: contentagent-social-history-content-agent-2-499616
  _DATA_OBJECT: app.json

steps:
  - name: gcr.io/google.com/cloudsdktool/cloud-sdk:slim
    entrypoint: bash
    args:
      - -c
      - |
        gcloud storage buckets describe gs://${_DATA_BUCKET} >/dev/null 2>&1 || \
          gcloud storage buckets create gs://${_DATA_BUCKET} --project=$PROJECT_ID --location=${_REGION} --uniform-bucket-level-access
        RUNTIME_SA=$(gcloud run services describe ${_SERVICE} --project=$PROJECT_ID --region=${_REGION} --format='value(spec.template.spec.serviceAccountName)' 2>/dev/null || true)
        if [ -z "$RUNTIME_SA" ]; then
          PROJECT_NUMBER=$(gcloud projects describe $PROJECT_ID --format='value(projectNumber)')
          RUNTIME_SA="$PROJECT_NUMBER-compute@developer.gserviceaccount.com"
        fi
        gcloud storage buckets add-iam-policy-binding gs://${_DATA_BUCKET} \
          --member="serviceAccount:$RUNTIME_SA" \
          --role="roles/storage.objectAdmin" >/dev/null 2>&1 || true
        gcloud storage objects describe gs://${_DATA_BUCKET}/${_DATA_OBJECT} >/dev/null 2>&1 || \
          gcloud storage cp data-seed/app.json gs://${_DATA_BUCKET}/${_DATA_OBJECT}

  - name: gcr.io/cloud-builders/docker
    args:
      - build
      - -t
      - ${_REGION}-docker.pkg.dev/$PROJECT_ID/${_AR_REPO}/${_SERVICE}:$COMMIT_SHA
      - .

  - name: gcr.io/cloud-builders/docker
    args:
      - push
      - ${_REGION}-docker.pkg.dev/$PROJECT_ID/${_AR_REPO}/${_SERVICE}:$COMMIT_SHA

  - name: gcr.io/google.com/cloudsdktool/cloud-sdk:slim
    entrypoint: bash
    args:
      - -c
      - |
        cat > cloudrun-env.yaml <<'EOF'
        APIFY_ACTOR_ID: "apify/google-search-scraper"
        APIFY_KEYWORD_ACTOR_ID: "apify/google-search-scraper"
        APIFY_TIKTOK_ACTOR_ID: "clockworks/tiktok-scraper"
        APIFY_INSTAGRAM_ACTOR_ID: "apify/instagram-scraper"
        APIFY_YOUTUBE_ACTOR_ID: "streamers/youtube-scraper"
        APIFY_FACEBOOK_ACTOR_ID: "scrapeforge/facebook-search-posts"
        UPLOAD_POST_PROFILE: "Mariana"
        UPLOAD_POST_DEFAULT_PLATFORMS: "tiktok,facebook,x"
        TELEGRAM_ALLOWED_USER_IDS: "1151114885"
        DATA_STORE_GCS_BUCKET: "${_DATA_BUCKET}"
        DATA_STORE_GCS_OBJECT: "${_DATA_OBJECT}"
        EOF

  - name: gcr.io/google.com/cloudsdktool/cloud-sdk:slim
    entrypoint: gcloud
    args:
      - run
      - deploy
      - ${_SERVICE}
      - --image=${_REGION}-docker.pkg.dev/$PROJECT_ID/${_AR_REPO}/${_SERVICE}:$COMMIT_SHA
      - --region=${_REGION}
      - --platform=managed
      - --env-vars-file=cloudrun-env.yaml
      - --set-secrets=APP_SECRET=APP_SECRET:latest,KIE_API_TOKEN=KIE_API_TOKEN:latest,APIFY_API_TOKEN=APIFY_API_TOKEN:latest,UPLOAD_POST_API_KEY=UPLOAD_POST_API_KEY:latest,TELEGRAM_BOT_TOKEN=TELEGRAM_BOT_TOKEN:latest
      - --quiet

  - name: gcr.io/google.com/cloudsdktool/cloud-sdk:slim
    entrypoint: gcloud
    args:
      - run
      - services
      - update
      - ${_SERVICE}
      - --region=${_REGION}
      - --no-invoker-iam-check
      - --quiet

images:
  - ${_REGION}-docker.pkg.dev/$PROJECT_ID/${_AR_REPO}/${_SERVICE}:$COMMIT_SHA
